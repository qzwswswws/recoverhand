<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script>
    if (new URLSearchParams(window.location.search).get('embed') === 'recoverhand') {
      document.documentElement.classList.add('recoverhand-embed');
    }
  </script>
  <title>手部粒子聚合动画原型</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f4f7ff;
      --muted: #8f9bb3;
      --glass: rgba(12, 16, 27, 0.72);
      --line: rgba(156, 188, 255, 0.18);
      --cyan: #63e5ff;
      --rose: #ff779f;
      --gold: #ffd993;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #020308; }
    body { font-family: Inter, "Microsoft YaHei", system-ui, sans-serif; color: var(--ink); }
    #stage { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; }
    #stage:active { cursor: grabbing; }
    .vignette {
      pointer-events: none; position: fixed; inset: 0;
      background:
        radial-gradient(circle at 52% 42%, transparent 20%, rgba(1,2,7,.16) 55%, rgba(0,0,3,.84) 100%),
        linear-gradient(180deg, rgba(3,8,18,.12), rgba(0,0,0,.48));
    }
    .topbar { position: fixed; left: 28px; top: 24px; pointer-events: none; }
    .eyebrow { color: var(--cyan); font-size: 11px; letter-spacing: .24em; text-transform: uppercase; }
    h1 { margin: 8px 0 3px; font-size: clamp(22px, 3vw, 38px); font-weight: 520; letter-spacing: -.035em; }
    .subtitle { color: var(--muted); font-size: 12px; letter-spacing: .06em; }
    .stage-pill {
      margin-top: 14px; display: inline-flex; align-items: center; gap: 9px;
      padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: rgba(7,12,24,.48);
      color: #d9e6ff; font-size: 12px; backdrop-filter: blur(14px);
    }
    .stage-pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 12px var(--cyan); }
    .panel {
      position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%);
      width: min(920px, calc(100vw - 28px)); padding: 14px 16px 12px;
      background: var(--glass); border: 1px solid var(--line); border-radius: 18px;
      box-shadow: 0 18px 70px rgba(0,0,0,.45); backdrop-filter: blur(20px);
    }
    .controls { display: grid; grid-template-columns: auto auto 1fr auto auto auto; gap: 10px; align-items: center; }
    button, select {
      border: 1px solid rgba(151,185,255,.2); background: rgba(255,255,255,.055); color: var(--ink);
      border-radius: 10px; min-height: 34px; padding: 0 11px; font: inherit; cursor: pointer;
    }
    button:hover, select:hover { border-color: rgba(125,219,255,.52); background: rgba(98,221,255,.09); }
    button.primary { background: linear-gradient(135deg, rgba(58,179,255,.25), rgba(255,92,153,.16)); }
    input[type="range"] { width: 100%; accent-color: #76ddff; }
    .time { min-width: 76px; text-align: right; font-variant-numeric: tabular-nums; color: #c7d5ec; font-size: 12px; }
    .parameters { display: grid; grid-template-columns: auto minmax(120px,1fr) 38px minmax(120px,1fr) 38px minmax(120px,1fr) 38px; gap: 9px; align-items: center; margin-top: 10px; }
    .parameter { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: center; color: #9facc2; font-size: 11px; white-space: nowrap; }
    .parameter output { color: #d8e7ff; text-align: right; font-size: 10px; font-variant-numeric: tabular-nums; }
    .finger-controls { display: grid; grid-template-columns: auto minmax(150px,1fr) 38px minmax(150px,1fr) 38px; gap: 9px; align-items: center; margin-top: 9px; }
    .finger-controls .selector { display: grid; grid-template-columns: auto auto; gap: 7px; align-items: center; color: #9facc2; font-size: 11px; white-space: nowrap; }
    .finger-controls select { min-height: 28px; padding: 0 8px; }
    .finger-controls output { color: #d8e7ff; text-align: right; font-size: 10px; font-variant-numeric: tabular-nums; }
    #commandMode.active { border-color: rgba(99,229,255,.58); color: #8beaff; background: rgba(65,211,255,.12); }
    .legend { display: flex; gap: 18px; margin-top: 9px; color: #77849c; font-size: 10px; letter-spacing: .04em; }
    .legend span::before { content: ""; display: inline-block; width: 12px; height: 1px; margin: 0 6px 3px 0; background: currentColor; }
    .hint { position: fixed; right: 24px; top: 26px; color: rgba(191,208,237,.55); font-size: 11px; text-align: right; line-height: 1.7; pointer-events: none; }
    #error {
      display: none; position: fixed; inset: 20px; place-items: center; padding: 30px;
      color: #ffd5dd; background: #08040a; border: 1px solid #7e283e; border-radius: 20px; white-space: pre-wrap;
    }
    html.recoverhand-embed, html.recoverhand-embed body { background: #061b18; }
    html.recoverhand-embed .topbar,
    html.recoverhand-embed .panel,
    html.recoverhand-embed .hint { display: none !important; }
    html.recoverhand-embed #stage { cursor: default; pointer-events: none; }
    html.recoverhand-embed .vignette {
      background:
        radial-gradient(circle at 52% 44%, transparent 25%, rgba(3,30,26,.16) 58%, rgba(1,13,12,.76) 100%),
        linear-gradient(180deg, rgba(5,35,31,.06), rgba(1,12,11,.38));
    }
    @media (max-width: 700px) {
      .controls { grid-template-columns: auto auto 1fr auto; }
      .record, .speed { display: none; }
      .hint { display: none; }
      .topbar { left: 18px; top: 18px; }
      .parameters { grid-template-columns: auto 1fr 34px; }
      .parameter.contact-control, .parameter.clarity-control { display: none; }
      .contact-output, .clarity-output { display: none; }
      .finger-controls { grid-template-columns: auto 1fr 34px; }
      .finger-controls .wave-control, .finger-controls .wave-output { display: none; }
    }
  </style>
</head>
<body>
  <canvas id="stage" aria-label="粒子从平面抬升，形成张开的三维手并握拳"></canvas>
  <div class="vignette"></div>
  <header class="topbar">
    <div class="eyebrow">Particle Hand Study · P03-E · Developer Edition</div>
    <h1>聚 · 形 · 握</h1>
    <div class="subtitle">平面粒子 → 3D 张手 → 握拳</div>
    <div class="stage-pill" id="stageLabel">粒子静息</div>
  </header>
  <div class="hint">拖动：旋转视角<br>滚轮：缩放<br>空格：播放 / 暂停</div>
  <section class="panel">
    <div class="controls">
      <button id="play" class="primary">暂停</button>
      <button id="replay">重播</button>
      <input id="timeline" type="range" min="0" max="12" step="0.001" value="0" aria-label="动画时间轴" />
      <span class="time" id="timeReadout">0.00 / 12.00</span>
      <select id="speed" class="speed" aria-label="播放速度">
        <option value="0.5">0.5×</option>
        <option value="1" selected>1.0×</option>
        <option value="1.5">1.5×</option>
      </select>
      <button id="record" class="record">录制一轮</button>
    </div>
    <div class="parameters">
      <button id="commandMode" title="切换动画时间轴与外部弯曲指令">指令：动画</button>
      <label class="parameter bend-control">弯曲指令<input id="bendCommand" type="range" min="0" max="1" step="0.01" value="0" aria-label="弯曲指令，0张手，1握拳" /></label>
      <output id="bendValue">—</output>
      <label class="parameter clarity-control">边界清晰<input id="clarity" type="range" min="0.5" max="1.5" step="0.01" value="1" aria-label="边界清晰程度" /></label>
      <output id="clarityValue" class="clarity-output">1.00</output>
      <label class="parameter contact-control">接触强度<input id="contact" type="range" min="0" max="1.5" step="0.01" value="1" aria-label="皮肤接触强度" /></label>
      <output id="contactValue" class="contact-output">1.00</output>
    </div>
    <div class="finger-controls">
      <label class="selector">控制对象
        <select id="fingerSelect" aria-label="选择单独控制的手指">
          <option value="all">五指同步</option>
          <option value="thumb">拇指</option>
          <option value="index">食指</option>
          <option value="middle">中指</option>
          <option value="ring">无名指</option>
          <option value="little">小拇指</option>
        </select>
      </label>
      <label class="parameter">弯曲<input id="fingerCommand" type="range" min="0" max="1" step="0.01" value="0" aria-label="所选手指弯曲程度" /></label>
      <output id="fingerValue">0.00</output>
      <label class="parameter wave-control">粒子波动<input id="wave" type="range" min="0" max="1.5" step="0.01" value="0" aria-label="粒子波动强度" /></label>
      <output id="waveValue" class="wave-output">0.00</output>
    </div>
    <div class="legend">
      <span style="color:#63e5ff">抬升 1.2–5.6s</span>
      <span style="color:#ffd993">张手 5.6–7.4s</span>
      <span style="color:#ff779f">握拳 7.4–10.4s</span>
    </div>
  </section>
  <div id="error"></div>

  <script src="./hand-particle-data.js"></script>
  <script>
  (() => {
    'use strict';
    const VERSION = 'P03E-dev-1.0.0';
    const DURATION = 12;
    const EMBED_MODE = document.documentElement.classList.contains('recoverhand-embed');
    const EMBED_PROFILE = Object.freeze({
      maxDevicePixelRatio: 1,
      bloomPasses: 1,
      useHdrTargets: false
    });
    window.RECOVERHAND_EMBED_PROFILE = EMBED_MODE ? EMBED_PROFILE : null;
    const canvas = document.getElementById('stage');
    const errorBox = document.getElementById('error');
    const gl = canvas.getContext('webgl2', {
      alpha: false,
      antialias: !EMBED_MODE,
      preserveDrawingBuffer: !EMBED_MODE,
      powerPreference: 'high-performance',
      desynchronized: EMBED_MODE
    });
    if (!gl) {
      errorBox.style.display = 'grid';
      errorBox.textContent = '当前浏览器未启用 WebGL2，无法播放 P03-E 开发版。';
      return;
    }

    const vertexShader = `#version 300 es
      precision highp float;
      in vec3 aStart;
      in vec3 aPose;
      in vec3 aPrevPose;
      in vec3 aColor;
      in float aSeed;
      in float aLineT;
      in float aContact;
      uniform float uTime;
      uniform float uEffectTime;
      uniform float uBend;
      uniform float uWave;
      uniform float uAspect;
      uniform float uYaw;
      uniform float uPitch;
      uniform float uZoom;
      uniform float uPointScale;
      uniform float uMode;
      uniform float uStatic;
      uniform float uGlobalAlpha;
      out vec3 vColor;
      out float vAlpha;
      out float vSpeed;

      float saturate(float v) { return clamp(v, 0.0, 1.0); }
      float ease(float v) { v = saturate(v); return v*v*(3.0-2.0*v); }
      float smoother(float v) { v = saturate(v); return v*v*v*(v*(v*6.0-15.0)+10.0); }

      vec3 waveOffset(vec3 p,float tm) {
        float along=saturate((p.y+2.85)/5.95);
        float phase=tm*2.20-along*8.40+aSeed*.72;
        float crest=sin(phase);
        float side=sin(phase*.71+aSeed*11.7);
        return vec3(side*.013,cos(phase*.83+aSeed*4.1)*.010,crest*.043)*uWave;
      }

      vec3 basePose(float tm, vec3 target) {
        float delay = 1.02 + aSeed * 0.94;
        float arrive = 4.56 + aSeed * 0.46;
        float gather = smoother((tm - delay) / max(0.35, arrive - delay));
        float phase = aSeed * 6.2831853 + floor(aSeed * 7.0) * .31;
        vec3 drift = vec3(sin(phase),0.0,cos(phase)) * (.30 + aSeed*.54);
        vec3 p1 = aStart + vec3(drift.x,1.05+aSeed*.72,drift.z);
        vec3 p2 = target + vec3(-drift.z*.38,-.48,drift.x*.38);
        float inv = 1.0-gather;
        vec3 p = inv*inv*inv*aStart + 3.0*inv*inv*gather*p1 + 3.0*inv*gather*gather*p2 + gather*gather*gather*target;

        float flow = pow(max(0.0,sin(gather*3.14159265)),1.15);
        p.x += sin(tm*1.52 + phase + p.y*1.18) * flow * .115;
        p.z += cos(tm*1.28 + phase*.83 + p.x*1.07) * flow * .125;

        float travel = (1.0 - gather) + 0.28 * sin(gather * 3.14159265);
        vec3 shimmer = vec3(
          sin(phase + tm * 1.7),
          sin(phase * 1.37 + tm * 1.15),
          cos(phase * 0.91 + tm * 1.42)
        );
        p += shimmer * (0.012 + 0.055 * travel);
        return p;
      }

      vec3 rotateView(vec3 p) {
        float cy = cos(uYaw), sy = sin(uYaw);
        p.xz = mat2(cy, -sy, sy, cy) * p.xz;
        float cp = cos(uPitch), sp = sin(uPitch);
        p.yz = mat2(cp, -sp, sp, cp) * p.yz;
        return p;
      }

      void main() {
        float prevT = max(0.0, uTime - (0.030 + aSeed * 0.045));
        float effectT = uStatic > 0.5 ? uEffectTime : uTime;
        float prevEffectT = max(0.0, effectT - (0.030 + aSeed * 0.045));
        vec3 current = uStatic > 0.5 ? aPose : basePose(uTime, aPose);
        vec3 previous = uStatic > 0.5 ? aPrevPose : basePose(prevT, aPrevPose);
        if (uStatic > 0.5) {
          current.y += sin(effectT * 1.9 + aSeed * 15.0) * 0.018;
          previous.y += sin(prevEffectT * 1.9 + aSeed * 15.0) * 0.018;
        }
        float waveReady=uStatic>.5?1.0:smoother((uTime-3.70)/1.25);
        current+=waveOffset(current,effectT)*waveReady;
        previous+=waveOffset(previous,prevEffectT)*waveReady;
        vec3 p = mix(current, previous, aLineT * uMode);
        float speed = length(current - previous) * 20.0;

        p.y += 0.16;
        p = rotateView(p);
        p.z += uZoom;
        float focal = 2.28;
        // Perspective depth for a positive-Z camera (near 3, far 20).
        gl_Position = vec4(p.x * focal / uAspect, p.y * focal, 1.352941 * p.z - 7.058824, p.z);
        float fistStrain = smoother(uBend);
        float anatomyCut = uMode < 0.5 ? max(aLineT,0.0) : 0.0;
        float wrinkle = uMode < 0.5 ? max(-aLineT,0.0) : 0.0;
        float wrinkleSize = mix(1.0,mix(.88,1.10,fistStrain),wrinkle);
        gl_PointSize = uPointScale * (7.4 / max(3.0, p.z)) * (0.72 + aSeed * 0.62) * (1.0-anatomyCut*.16) * wrinkleSize * (1.0+aContact*.13);

        float fadeIn = ease(uTime / 0.45);
        float fadeOut = 1.0 - ease((uTime - 11.35) / 0.6);
        float cutDepth = mix(.25,.90,fistStrain);
        float wrinkleGain = mix(.42,1.46,fistStrain);
        float waveHighlight=pow(.5+.5*sin(effectT*2.20-saturate((current.y+2.85)/5.95)*8.40+aSeed*.72),6.0)*uWave;
        vAlpha = uGlobalAlpha * fadeIn * fadeOut * (1.0-anatomyCut*cutDepth) * mix(1.0,wrinkleGain,wrinkle) * (1.0+aContact*.18) * (1.0+.16*waveHighlight);
        float depthLight = clamp(1.10 - (p.z - 10.5) * 0.045, 0.78, 1.16);
        vec3 baseColor = aColor * (0.86 + min(speed, 1.45) * 0.18) * depthLight;
        baseColor=mix(baseColor,vec3(.78,1.05,1.10),min(.22,waveHighlight*.15));
        vColor = mix(baseColor,vec3(.64,1.06,1.12),aContact*.18);
        vSpeed = speed;
      }
    `;

    const fragmentShader = `#version 300 es
      precision highp float;
      uniform float uMode;
      uniform float uSoftness;
      in vec3 vColor;
      in float vAlpha;
      in float vSpeed;
      out vec4 fragColor;
      void main() {
        float alpha = vAlpha;
        if (uMode < 0.5) {
          vec2 q = gl_PointCoord - 0.5;
          float d = length(q) * 2.0;
          float glow = exp(-d*d * uSoftness);
          float core = smoothstep(1.0, 0.12, d);
          alpha *= mix(glow, core, 0.42);
          if (d > 1.0) discard;
        } else {
          float moving = smoothstep(0.10, 0.42, vSpeed);
          float overloadGuard = 1.0 / (1.0 + 0.12 * max(0.0, vSpeed - 1.5));
          alpha *= moving * overloadGuard * (0.27 + min(vSpeed, 2.4) * 0.10);
        }
        fragColor = vec4(vColor, alpha);
      }
    `;

    const cubeVertexShader = `#version 300 es
      precision highp float;
      in vec3 aPosition;
      uniform float uAspect;
      uniform float uYaw;
      uniform float uPitch;
      uniform float uZoom;
      void main() {
        vec3 p = aPosition;
        p.y += .14;
        float cy = cos(uYaw), sy = sin(uYaw);
        p.xz = mat2(cy, -sy, sy, cy) * p.xz;
        float cp = cos(uPitch), sp = sin(uPitch);
        p.yz = mat2(cp, -sp, sp, cp) * p.yz;
        p.z += uZoom;
        float focal = 2.28;
        gl_Position = vec4(p.x * focal / uAspect, p.y * focal, 1.352941 * p.z - 7.058824, p.z);
      }
    `;

    const cubeFragmentShader = `#version 300 es
      precision highp float;
      uniform vec3 uColor;
      uniform float uAlpha;
      out vec4 fragColor;
      void main() { fragColor = vec4(uColor, uAlpha); }
    `;

    const postVertexShader = `#version 300 es
      precision highp float;
      out vec2 vUv;
      void main() {
        vec2 p = gl_VertexID == 0 ? vec2(-1.0,-1.0) : (gl_VertexID == 1 ? vec2(3.0,-1.0) : vec2(-1.0,3.0));
        vUv = p * 0.5 + 0.5;
        gl_Position = vec4(p,0.0,1.0);
      }
    `;

    const brightFragmentShader = `#version 300 es
      precision highp float;
      in vec2 vUv;
      uniform sampler2D uTexture;
      uniform float uThreshold;
      out vec4 fragColor;
      void main() {
        vec3 c = texture(uTexture,vUv).rgb;
        float peak = max(c.r,max(c.g,c.b));
        float contribution = smoothstep(uThreshold,uThreshold + 0.62,peak);
        fragColor = vec4(c * contribution,1.0);
      }
    `;

    const blurFragmentShader = `#version 300 es
      precision highp float;
      in vec2 vUv;
      uniform sampler2D uTexture;
      uniform vec2 uDirection;
      uniform vec2 uTexel;
      out vec4 fragColor;
      void main() {
        vec2 d = uDirection * uTexel;
        vec3 c = texture(uTexture,vUv).rgb * 0.227027;
        c += texture(uTexture,vUv + d * 1.384615).rgb * 0.316216;
        c += texture(uTexture,vUv - d * 1.384615).rgb * 0.316216;
        c += texture(uTexture,vUv + d * 3.230769).rgb * 0.070270;
        c += texture(uTexture,vUv - d * 3.230769).rgb * 0.070270;
        fragColor = vec4(c,1.0);
      }
    `;

    const compositeFragmentShader = `#version 300 es
      precision highp float;
      in vec2 vUv;
      uniform sampler2D uScene;
      uniform sampler2D uBloom;
      uniform float uBloomStrength;
      uniform float uTime;
      out vec4 fragColor;
      float hash21(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7))) * 43758.5453123);}
      vec3 aces(vec3 x){
        return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.0,1.0);
      }
      void main() {
        vec3 scene = texture(uScene,vUv).rgb;
        vec3 bloom = texture(uBloom,vUv).rgb;
        vec3 c = scene + bloom * uBloomStrength;
        c *= vec3(0.88,1.06,1.13);
        c = aces(c * 1.08);
        float vignette = 1.0 - smoothstep(0.18,0.86,length(vUv-0.5));
        c *= mix(0.74,1.0,vignette);
        c += (hash21(gl_FragCoord.xy + uTime * 31.0)-0.5) / 255.0;
        fragColor = vec4(c,1.0);
      }
    `;

    function compile(type, source) {
      const shader = gl.createShader(type);
      gl.shaderSource(shader, source);
      gl.compileShader(shader);
      if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(shader));
      return shader;
    }
    function createProgram() {
      const program = gl.createProgram();
      gl.attachShader(program, compile(gl.VERTEX_SHADER, vertexShader));
      gl.attachShader(program, compile(gl.FRAGMENT_SHADER, fragmentShader));
      gl.linkProgram(program);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));
      return program;
    }

    function createAuxProgram(vs, fs) {
      const result = gl.createProgram();
      gl.attachShader(result, compile(gl.VERTEX_SHADER, vs));
      gl.attachShader(result, compile(gl.FRAGMENT_SHADER, fs));
      gl.linkProgram(result);
      if (!gl.getProgramParameter(result, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(result));
      return result;
    }

    let program, cubeProgram, brightProgram, blurProgram, compositeProgram;
    try {
      program = createProgram();
      cubeProgram = createAuxProgram(cubeVertexShader, cubeFragmentShader);
      brightProgram = createAuxProgram(postVertexShader, brightFragmentShader);
      blurProgram = createAuxProgram(postVertexShader, blurFragmentShader);
      compositeProgram = createAuxProgram(postVertexShader, compositeFragmentShader);
    }
    catch (err) {
      errorBox.style.display = 'grid';
      errorBox.textContent = '着色器初始化失败：\n' + err.message;
      return;
    }
    gl.useProgram(program);

    function mulberry32(seed) {
      return function() {
        let t = seed += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 7, t | 61);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
    }
    const rand = mulberry32(0x51F15EED);
    const meshData = window.HAND_PARTICLE_DATA;
    if (!meshData || !meshData.vertices || !meshData.sampleIndices || !meshData.bonePositions) {
      errorBox.style.display='grid';
      errorBox.textContent='统一手部粒子数据未加载，请确认 hand-particle-data.js 与本页面位于同一目录。';
      return;
    }
    function decodeTyped(base64,Type) {

    function setHandedness(value){const next=String(value).toLowerCase();if(next!=='left'&&next!=='right')throw new Error(`未知手别：${value}`);handedness=next;canvas.style.transform=handedness==='left'?'scaleX(-1)':'none';canvas.style.transformOrigin='50% 50%';return handedness;}
    function applyFeedbackFrame(frame={}){
      const receivedAt=performance.now();
      if(frame.handedness!==undefined||frame.hand_side!==undefined)setHandedness(frame.handedness??frame.hand_side);
      if(frame.grip!==undefined||frame.grip_target_01!==undefined||frame.erd_strength!==undefined){bendCommand=finiteClamp(frame.grip??frame.grip_target_01??frame.erd_strength,0,1,'grip');fingerCommands=null;if(time<5.6||time>11.2)time=6.35;playing=false;}
      if(frame.wave!==undefined){waveStrength=finiteClamp(frame.wave,0,1.5,'wave');waveSlider.value=waveStrength;}
      if(frame.clarity!==undefined){boundaryClarity=finiteClamp(frame.clarity,.5,1.5,'clarity');claritySlider.value=boundaryClarity;}
      if(frame.contact_stiffness!==undefined){contactStiffness=finiteClamp(frame.contact_stiffness,0,1.5,'contact_stiffness');contactSlider.value=contactStiffness;}
      poseRevision++;
      if(pendingFeedbackAck)droppedFeedbackFrames++;
      pendingFeedbackAck={schema:'particlehand-render-ack/1',seq:Number.isFinite(Number(frame.seq))?Number(frame.seq):null,command_id:frame.command_id??null,received_at_performance_ms:receivedAt,applied_at_performance_ms:performance.now()};
      updateUI();
      return getState();
    }
    function getState(){return {version:VERSION,mode:fingerCommands?'fingers':(bendCommand===null?'timeline':'command'),handedness,bend:bendCommand,fingers:fingerCommands?Object.fromEntries(fingerKeys.map((key,index)=>[key,fingerCommands[index]])):null,waveStrength,boundaryClarity,contactStiffness,time,effectTime,duration:DURATION,playing,speed,camera:{yaw,pitch,zoom,autoOrbit}};}
    window.particleHand={
      version:VERSION,ready:true,setCommand:setBendInstruction,setBend:setBendInstruction,setFinger:setFingerInstruction,setFingers:setFingerCommands,
      setWave:setWaveStrength,setWaveStrength,setBoundaryClarity,setContactStiffness,setHandedness,applyFeedbackFrame,useTimeline,setTime,play,pause,setPlaybackSpeed,setCamera,getState
    };
    window.dispatchEvent(new CustomEvent('particlehand:ready',{detail:{version:VERSION,api:window.particleHand}}));

    function resize() {
      const maxDpr=EMBED_MODE?EMBED_PROFILE.maxDevicePixelRatio:2;
      const dpr = Math.min(maxDpr, window.devicePixelRatio || 1);
      const w = Math.floor(canvas.clientWidth*dpr), h=Math.floor(canvas.clientHeight*dpr);
      if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;}
      ensureTargets();
    }
    function draw(mode, scale, alpha, softness, primitive, vertexCount, set, staticMode=0) {
      bindSet(set);
      gl.uniform1f(U.uMode, mode); gl.uniform1f(U.uStatic,staticMode); gl.uniform1f(U.uPointScale, scale); gl.uniform1f(U.uGlobalAlpha, alpha); gl.uniform1f(U.uSoftness, softness);
      gl.drawArrays(primitive, 0, vertexCount);
    }

    let last = performance.now();
    function frame(now) {
      resize();
      const dt=Math.max(0,Math.min(.05,(now-last)/1000)); last=now;
      effectTime+=dt;
      if(playing){time+=dt*speed;if(time>=DURATION)time%=DURATION;}
      if(autoOrbit) yaw = -.62 + Math.sin(now*.00017)*.13;
      updateArticulatedPose(time);
      gl.bindFramebuffer(gl.FRAMEBUFFER,sceneTarget.framebuffer);
      gl.viewport(0,0,sceneTarget.width,sceneTarget.height);
      gl.enable(gl.BLEND);
      gl.depthMask(true);
      gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

      gl.useProgram(cubeProgram);
      gl.uniform1f(cubeU.aspect,canvas.width/canvas.height); gl.uniform1f(cubeU.yaw,yaw); gl.uniform1f(cubeU.pitch,pitch); gl.uniform1f(cubeU.zoom,zoom);
      gl.uniform3f(cubeU.color,.12,.63,.82);
      gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
      const cubeVisibility=1-.62*smoothJS((time-1.0)/4.4);
      drawCubePart(cubeGrid,.075*cubeVisibility);
      drawCubePart(cubeEdges,.30*cubeVisibility);

      gl.useProgram(program);
      const commandActive=bendCommand!==null||fingerCommands!==null,visualBend=commandActive?meanFingerBend():smoothJS((time-7.25)/2.85),commandStatic=commandActive?1:0;
      gl.uniform1f(U.uTime,time);gl.uniform1f(U.uEffectTime,effectTime);gl.uniform1f(U.uBend,visualBend);gl.uniform1f(U.uWave,waveStrength); gl.uniform1f(U.uAspect,canvas.width/canvas.height); gl.uniform1f(U.uYaw,yaw); gl.uniform1f(U.uPitch,pitch); gl.uniform1f(U.uZoom,zoom);
      gl.enable(gl.DEPTH_TEST);
      gl.depthFunc(gl.LEQUAL);
      gl.depthMask(true);
      gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);
      draw(0,4.55*(1.06-.06*boundaryClarity),.98,6.9+1.3*boundaryClarity,gl.POINTS,count,attrs,commandStatic);
      draw(0,1.72*(.92+.08*boundaryClarity),.98,12+3*boundaryClarity,gl.POINTS,detailCount,detailAttrs,commandStatic);

      gl.depthMask(false);
      gl.disable(gl.DEPTH_TEST);
      gl.blendFunc(gl.SRC_ALPHA,gl.ONE);
      gl.uniform1f(U.uWave,0);
      draw(0,14.0,.14,2.1,gl.POINTS,poolCount,poolAttrs,1);
      draw(0,4.2,.52,8.0,gl.POINTS,poolCount,poolAttrs,1);
      draw(0,6.4,.072,2.6,gl.POINTS,cloudCount,cloudAttrs);
      draw(0,2.35,.29,8.6,gl.POINTS,cloudCount,cloudAttrs);
      gl.uniform1f(U.uWave,waveStrength);
      draw(0,12.2,.082*(1.20-.20*boundaryClarity),2.5,gl.POINTS,count,attrs,commandStatic);
      draw(1,1,.34,3,gl.LINES,lineCount,lineBuffers);
      gl.depthMask(true);

      gl.disable(gl.BLEND);
      gl.disable(gl.DEPTH_TEST);
      gl.depthMask(false);

      gl.bindFramebuffer(gl.FRAMEBUFFER,bloomA.framebuffer);
      gl.viewport(0,0,bloomA.width,bloomA.height);
      gl.useProgram(brightProgram);
      gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,sceneTarget.texture);gl.uniform1i(brightU.texture,0);gl.uniform1f(brightU.threshold,.22+.05*boundaryClarity);
      gl.drawArrays(gl.TRIANGLES,0,3);

      gl.useProgram(blurProgram);
      gl.uniform1i(blurU.texture,0);gl.uniform2f(blurU.texel,1/bloomA.width,1/bloomA.height);
      const bloomPasses=EMBED_MODE?EMBED_PROFILE.bloomPasses:3;
      for(let i=0;i<bloomPasses;i++){
        const spread=1.0+i*1.45;
        gl.bindFramebuffer(gl.FRAMEBUFFER,bloomB.framebuffer);gl.viewport(0,0,bloomB.width,bloomB.height);
        gl.bindTexture(gl.TEXTURE_2D,bloomA.texture);gl.uniform2f(blurU.direction,spread,0);gl.drawArrays(gl.TRIANGLES,0,3);
        gl.bindFramebuffer(gl.FRAMEBUFFER,bloomA.framebuffer);gl.viewport(0,0,bloomA.width,bloomA.height);
        gl.bindTexture(gl.TEXTURE_2D,bloomB.texture);gl.uniform2f(blurU.direction,0,spread);gl.drawArrays(gl.TRIANGLES,0,3);
      }

      gl.bindFramebuffer(gl.FRAMEBUFFER,null);
      gl.viewport(0,0,canvas.width,canvas.height);
      gl.useProgram(compositeProgram);
      gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,sceneTarget.texture);gl.uniform1i(compositeU.scene,0);
      gl.activeTexture(gl.TEXTURE1);gl.bindTexture(gl.TEXTURE_2D,bloomA.texture);gl.uniform1i(compositeU.bloom,1);
      gl.uniform1f(compositeU.strength,1.87-.35*boundaryClarity);gl.uniform1f(compositeU.time,effectTime);
      gl.drawArrays(gl.TRIANGLES,0,3);
      gl.depthMask(true);
      if(pendingFeedbackAck){
        gl.flush();
        const detail={...pendingFeedbackAck,render_submitted_at_performance_ms:performance.now(),request_animation_frame_ms:now,dropped_input_frames:droppedFeedbackFrames,visibility_state:document.visibilityState,webgl_context_lost:gl.isContextLost(),renderer_state:getState()};
        pendingFeedbackAck=null;droppedFeedbackFrames=0;
        window.dispatchEvent(new CustomEvent('particlehand:presented',{detail}));
        if(window.parent!==window)window.parent.postMessage({type:'particlehand:presented',detail},window.location.origin);
      }
      if(!EMBED_MODE)updateUI();
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();
  </script>
</body>
