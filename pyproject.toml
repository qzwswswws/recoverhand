[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "recoverhand-host"
version = "0.2.0"
description = "康复手 EEG/EMG/辅助手套本地上位机"
requires-python = ">=3.11"
dependencies = [
  # 6.9+ 在当前 Anaconda/Windows 环境会与系统 ICU DLL 冲突；6.8 系列已实测通过。
  "PySide6>=6.8,<6.9",
  "pyqtgraph>=0.13,<1",
  "numpy>=1.25,<3",
]

[project.optional-dependencies]
eeg = ["brainflow>=5.16,<6", "scipy>=1.11,<2"]
emg = ["bleak>=0.22,<1"]
web-legacy = ["fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1"]
dev = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
recoverhand = "recoverhand_host.desktop.app:main"
recoverhand-emg-monitor = "recoverhand_host.emg_monitor.app:main"

[tool.setuptools.packages.find]
where = ["backend"]

[tool.setuptools.package-data]
recoverhand_host = ["desktop/*.qss", "desktop/assets/particle_hand/*", "emg_monitor/*.qss"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
